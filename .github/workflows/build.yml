
name: Build WEPP
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    defaults:
      run:
        # Ensures environment gets sourced right
        shell: bash -e -l {0}
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        FC: ["ifx", "gfortran"]
    steps:
    - uses: actions/checkout@v7

    - name: Install gfortran Compiler
      if: ${{ matrix.FC == 'gfortran' }}
      run: |
        sudo apt-get update
        sudo apt-get install -y gfortran

    - name: Build WEPP with gfortran
      if: ${{ matrix.FC == 'gfortran' }}
      run: |
        cd src/wepp20240930
        make FC=gfortran

    - name: Install Intel Compiler
      if: ${{ matrix.FC == 'ifx' }}
      run: |
        wget -qO- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB | sudo gpg --dearmor -o /usr/share/keyrings/oneapi-archive-keyring.gpg
        echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" | sudo tee /etc/apt/sources.list.d/oneAPI.list
        sudo apt-get update
        sudo apt-get install -y intel-oneapi-compiler-fortran

    - name: Build WEPP with Intel
      if: ${{ matrix.FC == 'ifx' }}
      run: |
        source /opt/intel/oneapi/setvars.sh
        cd src/wepp20240930
        make

    - name: Setup Python
      uses: mamba-org/setup-micromamba@v3
      with:
        environment-file: environment.yml
        condarc: |
          channels:
            - conda-forge
        create-args: >-
          python=3.14
        environment-name: prod
        cache-environment: true

    - name: Run Regression Tests
      run: |
        python -m pip install . --no-deps
        cd src/regression_tests
        python run_regressions.py
